<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>財富能量測驗</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <div class="app-container">
    
    <section id="welcome" class="screen">
      <div class="content-box">
        <h1>🔮 財富能量測驗</h1>
        <p>直覺作答 · 20題 · 發現你的致富天賦</p>
        <div class="input-group">
          <input type="text" id="username-input" placeholder="請輸入你的暱稱" maxlength="10">
        </div>
        <button id="start-btn" class="primary-btn">開始測驗</button>
      </div>
    </section>

    <section id="quiz-container" class="screen hidden">
      <div class="progress-container">
        <div class="progress-bar-bg">
          <div id="progress-bar-fill"></div>
        </div>
        <div id="progress-text">Question 1 / --</div>
      </div>

      <div class="question-box">
        <h2 id="question-text">題目載入中...</h2>
        <div id="options-grid"></div>
      </div>

      <div class="nav-controls">
        <button id="prev-btn" class="secondary-btn hidden" style="border:none; color:#999; font-size:0.9rem;">← 回上一題</button>
      </div>
    </section>

    <section id="result" class="screen hidden">
      <div class="content-box">
        
        <div id="capture-area" class="result-card">
          
          <div class="result-meta">
             <span id="current-date"></span>
             <span class="meta-divider">|</span>
             <span id="user-display-name" class="meta-name"></span>
          </div>

          <div class="profile-header">
            <span class="profile-subtitle">你的財富角色</span>
            <h1 id="result-role-name">計算中...</h1>
            <p id="result-role-desc">角色描述載入中...</p>
          </div>

          <div class="chart-wrapper">
            <canvas id="radarChart"></canvas>
          </div>

          <div class="stats-grid">
            <div class="energy-section">
              <h3>⚡ 能量分佈</h3>
              <div id="energy-bars"></div>
            </div>
            
            <div class="career-section">
              <h3>💼 適合角色</h3>
              <ul id="result-careers"></ul>
            </div>
          </div>
          
          <div class="footer-watermark">
            <p>WEALTH ENERGY PROFILE</p>
          </div>
        </div>

        <div class="action-buttons">
          <button id="download-btn" class="primary-btn share-btn">📥 下載結果圖</button>
          <button id="retake-btn" class="secondary-btn">重新測驗</button>
        </div>

      </div>
    </section>

  </div>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
